# A persistent disk requires Render's paid Starter plan.
services:
  - type: web
    name: social-training-club
    runtime: python
    plan: starter
    buildCommand: python3 -m compileall -q server.py start.py
    startCommand: python3 start.py --host 0.0.0.0 --no-browser
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.12
      - key: STC_DATA_DIR
        value: /var/data/stc
      - key: STC_SETUP_TOKEN
        generateValue: true
    disk:
      name: club-data
      mountPath: /var/data
      sizeGB: 1
