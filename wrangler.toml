name = "supple"
main = "src/index.ts"
compatibility_date = "2025-09-06"

# Public address (LGH-free). Both the bare domain and www serve the app; the
# workers.dev URL keeps working as a fallback. Origin/cookies derive from the
# request host, so all addresses stay fully functional and secure.
routes = [
  { pattern = "socialtrainingclub.uk", custom_domain = true },
  { pattern = "www.socialtrainingclub.uk", custom_domain = true },
]

# Serves the FROZEN front-end (public/) unchanged, same-origin with the API.
# run_worker_first: the Worker handles every request so it can apply security
# headers to static responses too (and keep /api routing in one place).
assets = { directory = "./public", binding = "ASSETS", run_worker_first = true }

[[d1_databases]]
binding = "DB"
database_name = "supple"
database_id = "18ca15a4-2d0f-48f1-936e-bf6a4410b644"

# Video storage. Re-enable this block (and run `wrangler r2 bucket create
# supple-videos`) once R2 is turned on in the Cloudflare dashboard.
# [[r2_buckets]]
# binding = "VIDEOS"
# bucket_name = "supple-videos"

[ai]
binding = "AI"

# Weekly progress emails: Sunday 18:00 UTC (6pm UK in winter, 7pm in summer).
# A no-op until RESEND_API_KEY is set (`wrangler secret put RESEND_API_KEY`).
[triggers]
crons = ["0 18 * * SUN"]

[vars]
# Set empty for local dev. In production, leave blank to infer HTTPS from the request,
# or set to the exact public origin e.g. "https://training.example.com".
STC_PUBLIC_ORIGIN = ""
# STC_SETUP_TOKEN is set as a secret in production (`wrangler secret put STC_SETUP_TOKEN`).
# Local dev reads it from .dev.vars (see .dev.vars.example).
